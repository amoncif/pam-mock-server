parameters:
services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $projectDir: '%kernel.project_dir%'
            $tokenTtl: '%env(int:PAM_TOKEN_TTL)%'
    App\:
        resource: '../src/'
        exclude:
            - '../src/Pam/Authentication/Entity/'
            - '../src/Shared/Fixtures/Entity/'
            - '../src/Shared/Api/PamException.php'
    App\Shared\Api\ManifestOpenApiFactory:
        decorates: api_platform.openapi.factory
        arguments: ['@App\Shared\Api\ManifestOpenApiFactory.inner', '@App\Shared\Api\EndpointManifest']
    App\Shared\Api\ManifestRouteLoader:
        tags: [routing.loader]
